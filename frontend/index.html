<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLUGGED — Kenya's Plug for Fashion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05070f;
    --bg-grid: #070b1a;
    --surface:#0b1024;
    --surface-2:#111832;
    --line:#1f2b52;
    --line-bright:#2e3f78;
    --text:#e8ecff;
    --text-dim:#8b95c2;
    --cyan:#4df2ff;
    --violet:#8b5cf6;
    --pink:#ff2fb0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(139,92,246,0.18), transparent 60%),
      radial-gradient(ellipse 900px 500px at 90% 0%, rgba(77,242,255,0.14), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Rajdhani',sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Orbitron',sans-serif;
    letter-spacing:0.5px;
    text-transform:uppercase;
    font-weight:700;
  }
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  header{
    position:sticky;top:0;z-index:20;
    background:rgba(5,7,15,0.85);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:12px 20px;
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand svg{width:38px;height:38px;flex-shrink:0;}
  .brand .wordmark{font-size:20px;letter-spacing:2px;}
  .brand .wordmark span{color:var(--cyan);}

  nav{display:flex;gap:4px;flex-wrap:wrap;}
  nav button{
    background:transparent;border:1px solid transparent;color:var(--text-dim);
    padding:8px 14px;border-radius:4px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.6px;
    font-family:'Rajdhani',sans-serif;
    transition:all .15s ease;
  }
  nav button.active{color:var(--cyan);border-color:var(--cyan);background:rgba(77,242,255,0.07);box-shadow:0 0 12px rgba(77,242,255,0.25);}
  nav button:hover{color:var(--text);border-color:var(--line-bright);}

  .authbar{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-dim);}
  .btn{
    background:linear-gradient(135deg, var(--cyan), var(--violet));
    color:#05070f;border:none;padding:10px 18px;border-radius:4px;
    font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:0.6px;
    box-shadow:0 0 16px rgba(77,242,255,0.35);
  }
  .btn.secondary{background:transparent;border:1px solid var(--line-bright);color:var(--text);box-shadow:none;}
  .btn.ghost{background:transparent;border:none;color:var(--text-dim);text-decoration:underline;padding:4px;box-shadow:none;}
  .btn.teal{background:linear-gradient(135deg,#00ffc8,var(--cyan));color:#05070f;}
  .btn:disabled{opacity:0.4;cursor:not-allowed;box-shadow:none;}

  main{max-width:1180px;margin:0 auto;padding:0 20px 90px;}

  .hero{
    padding:56px 0 34px;text-align:left;border-bottom:1px solid var(--line);margin-bottom:26px;
    position:relative;
  }
  .hero .eyebrow{color:var(--cyan);font-size:12px;letter-spacing:3px;font-weight:700;text-transform:uppercase;font-family:'Orbitron',sans-serif;}
  .hero h1{font-size:clamp(28px,5vw,46px);margin:10px 0 8px;line-height:1.1;
    background:linear-gradient(90deg,var(--text) 40%, var(--cyan));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero p{color:var(--text-dim);font-size:15px;max-width:560px;margin:0;}

  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;align-items:center;}
  .chip{
    background:var(--surface);border:1px solid var(--line);color:var(--text-dim);
    padding:7px 14px;border-radius:999px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;
    transition:all .15s ease;
  }
  .chip.active{background:rgba(77,242,255,0.1);color:var(--cyan);border-color:var(--cyan);box-shadow:0 0 10px rgba(77,242,255,0.3);}
  .searchbox{
    flex:1 1 220px;background:var(--surface);border:1px solid var(--line);border-radius:4px;
    color:var(--text);padding:10px 14px;font-size:14px;
  }
  .searchbox:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan);}
  select.searchbox{appearance:none;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;}

  .tag-card{
    position:relative;background:var(--surface);border:1px solid var(--line);border-radius:8px;
    padding:16px 14px 14px;display:flex;flex-direction:column;gap:8px;
    transition:border-color .15s ease, box-shadow .15s ease, transform .15s ease;
  }
  .tag-card:hover{border-color:var(--line-bright);box-shadow:0 0 22px rgba(77,242,255,0.12);transform:translateY(-2px);}
  .tag-card .thumb{
    width:100%;aspect-ratio:1/1;border-radius:6px;background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:12px;
    overflow:hidden;border:1px solid var(--line);
  }
  .tag-card .thumb img{width:100%;height:100%;object-fit:cover;}
  .badge-row{display:flex;gap:6px;flex-wrap:wrap;}
  .badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;padding:3px 8px;border-radius:3px;}
  .badge.new{background:rgba(0,255,200,0.12);color:#00ffc8;border:1px solid rgba(0,255,200,0.4);}
  .badge.thrift{background:rgba(255,47,176,0.12);color:var(--pink);border:1px solid rgba(255,47,176,0.4);}
  .badge.cat{background:var(--surface-2);color:var(--text-dim);border:1px solid var(--line);}
  .tag-card h3{font-size:16px;margin:2px 0 0;text-transform:none;letter-spacing:0;font-family:'Rajdhani',sans-serif;font-weight:700;}
  .tag-card .brand-line{color:var(--text-dim);font-size:12px;margin:0;}
  .tag-card .desc{font-size:12px;color:var(--text-dim);margin:0;line-height:1.4;max-height:3.6em;overflow:hidden;}
  .price-row{display:flex;justify-content:space-between;align-items:baseline;margin-top:auto;padding-top:8px;border-top:1px dashed var(--line);}
  .price-row .total{font-size:18px;font-weight:700;color:var(--cyan);font-family:'Orbitron',sans-serif;}
  .price-row .breakdown{font-size:10px;color:var(--text-dim);}
  .status-sold{position:absolute;top:0;right:0;background:var(--pink);color:#05070f;font-size:10px;font-weight:700;padding:4px 10px;border-radius:0 8px 0 8px;text-transform:uppercase;letter-spacing:0.5px;}

  .empty{color:var(--text-dim);padding:50px 0;text-align:center;font-size:14px;}

  form{display:flex;flex-direction:column;gap:12px;max-width:520px;}
  label{font-size:12px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.4px;display:flex;flex-direction:column;gap:6px;}
  label input,label select,label textarea{
    background:var(--surface);border:1px solid var(--line);border-radius:4px;color:var(--text);
    padding:10px 12px;font-size:14px;font-weight:400;text-transform:none;letter-spacing:normal;
  }
  label input:focus,label select:focus,label textarea:focus{outline:none;border-color:var(--cyan);}
  label textarea{resize:vertical;min-height:70px;font-family:'Rajdhani',sans-serif;}
  .row2{display:flex;gap:12px;}
  .row2 > label{flex:1;}

  .card-box{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:22px;margin-bottom:18px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);}
  th{color:var(--text-dim);text-transform:uppercase;font-size:11px;letter-spacing:0.5px;font-family:'Orbitron',sans-serif;font-weight:500;}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(2,4,10,0.8);display:flex;align-items:center;justify-content:center;
    z-index:50;padding:16px;backdrop-filter:blur(4px);
  }
  .modal{background:var(--surface);border:1px solid var(--line-bright);border-radius:10px;padding:26px;max-width:430px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 0 40px rgba(77,242,255,0.15);}
  .modal h2{font-size:19px;margin-top:0;}
  .modal-close{float:right;background:none;border:none;color:var(--text-dim);font-size:22px;}
  .field-error{color:var(--pink);font-size:12px;margin:-4px 0 0;}

  .stat-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px;}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 20px;min-width:150px;}
  .stat .num{font-family:'Orbitron',sans-serif;font-size:26px;color:var(--cyan);text-shadow:0 0 12px rgba(77,242,255,0.4);}
  .stat .lbl{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--surface);border:1px solid var(--cyan);color:var(--text);
    padding:12px 22px;border-radius:6px;font-weight:600;font-size:13px;z-index:60;
    box-shadow:0 0 20px rgba(77,242,255,0.35);
  }
  .note{font-size:12px;color:var(--text-dim);background:var(--surface);border:1px dashed var(--line);padding:12px 14px;border-radius:6px;}
  footer{text-align:center;color:var(--text-dim);font-size:11px;padding:34px 0;border-top:1px solid var(--line);margin-top:20px;}
  .thumb-preview{max-width:120px;border-radius:6px;border:1px solid var(--line);margin-top:6px;}
  @media(max-width:600px){
    .row2{flex-direction:column;}
    header{padding:12px;}
    .hero{padding:34px 0 24px;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="2.2" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <linearGradient id="pGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#4DF2FF"/>
          <stop offset="100%" stop-color="#8B5CF6"/>
        </linearGradient>
        <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
          <stop offset="0%" stop-color="#0f1a3d"/>
          <stop offset="100%" stop-color="#05070f"/>
        </radialGradient>
      </defs>
      <rect x="0" y="0" width="100" height="100" rx="18" fill="url(#bgGlow)"/>
      <g transform="skewX(-10) translate(8,0)">
        <path d="M24 18 L24 82 L34 82 L34 54 L54 54 a17 17 0 0 0 0 -34 Z M34 28 L54 28 a7 7 0 0 1 0 14 L34 42 Z"
              fill="url(#pGrad)" filter="url(#glow)" fill-rule="evenodd"/>
      </g>
      <g transform="translate(56,58)" filter="url(#glow)">
        <path d="M3 8 V4.5 a5.5 5.5 0 0 1 11 0 V8" fill="none" stroke="#4DF2FF" stroke-width="2" stroke-linecap="round"/>
        <rect x="0" y="8" width="17" height="14" rx="2.5" fill="#05070f" stroke="#4DF2FF" stroke-width="2"/>
      </g>
      <path d="M12 84 Q 50 96 88 84" fill="none" stroke="#8B5CF6" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="1 6" filter="url(#glow)"/>
      <g transform="translate(84,76)" filter="url(#glow)">
        <path d="M4 0 a4 4 0 1 1 -0.01 0 Z M4 4 L4 10" stroke="#4DF2FF" stroke-width="1.6" fill="none"/>
        <circle cx="4" cy="4" r="1.4" fill="#4DF2FF"/>
      </g>
    </svg>
    <div class="wordmark">PLUG<span>GED</span></div>
  </div>
  <nav id="nav"></nav>
  <div class="authbar" id="authbar"></div>
</header>

<main id="app"></main>

<footer>PLUGGED — Kenya's plug for new &amp; thrifted fashion. Delivery flat fee KES <span id="feeFooter">180</span> · Platform commission <span id="commFooter">10%</span> of item price.</footer>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
const API = ''; // same-origin; the backend serves this file, so relative paths work.
let DELIVERY_FEE = 180;
let COMMISSION_RATE = 0.10;
const CATEGORIES = [
  "Trousers","Shorts","T-Shirts","Designer T-Shirts","Shirts","Officials","Jackets","Hoodies",
  "Tracksuits","Sweatpants","Jorts","Crochet Wear","Bikinis","Lingerie","Underwear","Gymwear",
  "Armwear","Belts","Headwear","Snapbacks","Glasses","Jewelry","Socks","Accessories",
  "Bags","Side Bags","Sneakers","Official Shoes","Heels","Female Shoes","Male Shoes","Unisex Shoes","Jerseys"
];

let state = {
  token: localStorage.getItem('plugged_token') || null,
  user: JSON.parse(localStorage.getItem('plugged_user') || 'null'),
  tab: "browse",
  listings: [],
  orders: [],
  filterCategory: "All",
  filterCondition: "All",
  search: ""
};

function money(n){ return "KES " + Number(n).toLocaleString(); }
function toast(msg){
  const root = document.getElementById('toast-root');
  root.innerHTML = `<div class="toast">${msg}</div>`;
  setTimeout(()=>{ root.innerHTML=""; }, 2800);
}

async function api(path, options={}){
  const headers = options.body instanceof FormData ? {} : {'Content-Type':'application/json'};
  if(state.token) headers['Authorization'] = 'Bearer ' + state.token;
  const res = await fetch(API + path, { ...options, headers: {...headers, ...(options.headers||{})} });
  let data;
  try{ data = await res.json(); }catch(e){ data = null; }
  if(!res.ok){
    throw new Error((data && data.error) || 'Something went wrong.');
  }
  return data;
}

function setSession(token, user){
  state.token = token; state.user = user;
  localStorage.setItem('plugged_token', token);
  localStorage.setItem('plugged_user', JSON.stringify(user));
}
function clearSession(){
  state.token = null; state.user = null;
  localStorage.removeItem('plugged_token');
  localStorage.removeItem('plugged_user');
}

async function loadConfig(){
  try{
    const cfg = await api('/api/orders/config');
    DELIVERY_FEE = cfg.deliveryFee;
    COMMISSION_RATE = cfg.commissionRate;
    document.getElementById('feeFooter').textContent = DELIVERY_FEE;
    document.getElementById('commFooter').textContent = Math.round(COMMISSION_RATE*100) + '%';
  }catch(e){}
}
async function loadListings(){
  const params = new URLSearchParams();
  if(state.filterCategory !== 'All') params.set('category', state.filterCategory);
  if(state.filterCondition !== 'All') params.set('condition', state.filterCondition);
  if(state.search.trim()) params.set('search', state.search.trim());
  state.listings = await api('/api/listings?' + params.toString());
}
async function loadMyOrders(){ state.orders = await api('/api/orders/mine'); }
async function loadAdminOrders(){ state.orders = await api('/api/orders'); }

// ---------- rendering ----------
function renderNav(){
  const tabs = [
    {id:"browse", label:"Browse"},
    {id:"sell", label:"Sell an item"},
  ];
  if(state.user){
    tabs.push({id:"mylistings", label:"My listings"});
    tabs.push({id:"myorders", label:"My orders"});
    if(state.user.isAdmin) tabs.push({id:"admin", label:"Admin · Orders"});
  }
  document.getElementById('nav').innerHTML = tabs.map(t=>
    `<button data-tab="${t.id}" class="${state.tab===t.id?'active':''}">${t.label}</button>`
  ).join('');
  document.querySelectorAll('#nav button').forEach(b=>{
    b.onclick = ()=>{ state.tab = b.dataset.tab; render(); };
  });
}

function renderAuthbar(){
  const el = document.getElementById('authbar');
  if(state.user){
    el.innerHTML = `<span>Plugged in as <b style="color:var(--cyan)">${state.user.username}</b></span><button class="btn ghost" id="logoutBtn">Log out</button>`;
    document.getElementById('logoutBtn').onclick = ()=>{ clearSession(); state.tab="browse"; render(); };
  } else {
    el.innerHTML = `<button class="btn secondary" id="loginBtn">Log in</button><button class="btn" id="signupBtn">Sign up</button>`;
    document.getElementById('loginBtn').onclick = ()=> openAuthModal('login');
    document.getElementById('signupBtn').onclick = ()=> openAuthModal('signup');
  }
}

function openAuthModal(mode){
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-overlay" id="overlay">
      <div class="modal">
        <button class="modal-close" id="closeModal">&times;</button>
        <h2>${mode==='login' ? 'Log in' : 'Get Plugged in'}</h2>
        <form id="authForm">
          <label>Username <input name="username" required></label>
          <label>Password <input name="password" type="password" required></label>
          ${mode==='signup' ? '<label>Phone number (for delivery / M-Pesa) <input name="phone" required placeholder="07XX XXX XXX"></label>' : ''}
          <p class="field-error" id="authError" style="display:none;"></p>
          <button class="btn" type="submit">${mode==='login' ? 'Log in' : 'Sign up'}</button>
        </form>
      </div>
    </div>`;
  document.getElementById('closeModal').onclick = ()=> root.innerHTML="";
  document.getElementById('overlay').onclick = (e)=>{ if(e.target.id==='overlay') root.innerHTML=""; };
  document.getElementById('authForm').onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const errEl = document.getElementById('authError');
    errEl.style.display = 'none';
    try{
      const body = { username: fd.get('username').trim(), password: fd.get('password') };
      if(mode==='signup') body.phone = fd.get('phone').trim();
      const data = await api(mode==='login' ? '/api/auth/login' : '/api/auth/signup', {
        method:'POST', body: JSON.stringify(body)
      });
      setSession(data.token, data.user);
      root.innerHTML="";
      toast(mode==='login' ? `Welcome back, ${data.user.username}` : `Account created. Welcome, ${data.user.username}`);
      await render();
    }catch(err){
      errEl.textContent = err.message;
      errEl.style.display = 'block';
    }
  };
}

async function renderBrowse(){
  await loadListings();
  const cats = ["All", ...CATEGORIES];
  const conds = ["All","Brand New","Thrifted"];

  document.getElementById('app').innerHTML = `
    <div class="hero">
      <div class="eyebrow">// New drops · Thrift finds · Delivered</div>
      <h1>Your next fit is Plugged in.</h1>
      <p>Buy new or thrifted fashion straight from real sellers across Kenya, or list your own pieces and get paid.
      Every price already includes the flat KES ${DELIVERY_FEE} delivery fee — no surprises at checkout.</p>
    </div>
    <div class="filters">
      <input class="searchbox" id="searchInput" placeholder="Search brand, size, item..." value="${state.search}">
      <select class="searchbox" id="catSelect" style="max-width:190px;">
        ${cats.map(c=>`<option ${state.filterCategory===c?'selected':''}>${c}</option>`).join('')}
      </select>
      <div style="display:flex;gap:6px;">
        ${conds.map(c=>`<button class="chip ${state.filterCondition===c?'active':''}" data-cond="${c}">${c}</button>`).join('')}
      </div>
    </div>
    <div class="grid" id="listingsGrid">
      ${state.listings.length===0 ? '<div class="empty">No items match yet. Try a different filter, or be the first to list something.</div>' :
        state.listings.map(cardHtml).join('')}
    </div>
  `;
  document.getElementById('searchInput').oninput = (e)=>{ state.search = e.target.value; debounceBrowse(); };
  document.getElementById('catSelect').onchange = (e)=>{ state.filterCategory = e.target.value; render(); };
  document.querySelectorAll('[data-cond]').forEach(b=>{ b.onclick = ()=>{ state.filterCondition = b.dataset.cond; render(); }; });
  document.querySelectorAll('[data-buy]').forEach(b=>{ b.onclick = ()=> openBuyModal(b.dataset.buy); });
}
let debounceTimer;
function debounceBrowse(){
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(async ()=>{
    await loadListings();
    document.getElementById('listingsGrid').innerHTML = state.listings.length===0 ? '<div class="empty">No items match yet.</div>' : state.listings.map(cardHtml).join('');
    document.querySelectorAll('[data-buy]').forEach(b=>{ b.onclick = ()=> openBuyModal(b.dataset.buy); });
  }, 350);
}

function cardHtml(l){
  const total = Number(l.price) + DELIVERY_FEE;
  const sold = l.status === 'sold';
  return `
    <div class="tag-card">
      ${sold ? '<div class="status-sold">Sold</div>' : ''}
      <div class="badge-row">
        <span class="badge cat">${l.category}</span>
        <span class="badge ${l.condition==='Brand New'?'new':'thrift'}">${l.condition}</span>
      </div>
      <div class="thumb">${l.imageUrl ? `<img src="${l.imageUrl}" onerror="this.parentElement.innerHTML='No image'">` : 'No image'}</div>
      <h3>${l.title}</h3>
      <p class="brand-line">${l.brand || 'Unbranded'} · Size ${l.size || '—'}</p>
      <p class="desc">${l.description || ''}</p>
      <div class="price-row">
        <div>
          <div class="total">${money(total)}</div>
          <div class="breakdown">${money(l.price)} item + ${money(DELIVERY_FEE)} delivery</div>
        </div>
        ${sold ? '' : `<button class="btn" data-buy="${l.id}">Buy</button>`}
      </div>
    </div>
  `;
}

function openBuyModal(listingId){
  if(!state.user){
    toast("Log in first to place an order.");
    openAuthModal('login');
    return;
  }
  const l = state.listings.find(x=>x.id===listingId);
  if(!l || l.status !== 'available'){ toast("That item is no longer available."); render(); return; }
  const total = Number(l.price) + DELIVERY_FEE;
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-overlay" id="overlay">
      <div class="modal">
        <button class="modal-close" id="closeModal">&times;</button>
        <h2>Confirm order</h2>
        <p style="font-size:13px;color:var(--text-dim);">${l.title} — ${l.brand||''}, size ${l.size||'—'}</p>
        <p style="font-size:14px;"><b style="color:var(--cyan)">${money(total)}</b> total (${money(l.price)} + ${money(DELIVERY_FEE)} delivery)</p>
        <form id="buyForm">
          <label>Full name <input name="name" required></label>
          <label>Phone number <input name="phone" required value="${state.user.phone||''}"></label>
          <label>Delivery address / area <input name="address" required placeholder="e.g. Nyali, Mombasa"></label>
          <label>Payment method
            <select name="payment">
              <option>M-Pesa</option>
              <option>Cash on delivery</option>
            </select>
          </label>
          <p class="field-error" id="buyError" style="display:none;"></p>
          <button class="btn" type="submit">Place order</button>
        </form>
      </div>
    </div>`;
  document.getElementById('closeModal').onclick = ()=> root.innerHTML="";
  document.getElementById('overlay').onclick = (e)=>{ if(e.target.id==='overlay') root.innerHTML=""; };
  document.getElementById('buyForm').onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const errEl = document.getElementById('buyError');
    try{
      await api('/api/orders', { method:'POST', body: JSON.stringify({
        listingId: l.id, name: fd.get('name'), phone: fd.get('phone'), address: fd.get('address'), payment: fd.get('payment')
      })});
      root.innerHTML = "";
      state.tab = "myorders";
      await render();
      toast("Order placed! The admin will confirm delivery.");
    }catch(err){
      errEl.textContent = err.message; errEl.style.display='block';
    }
  };
}

function renderSell(){
  if(!state.user){
    document.getElementById('app').innerHTML = `
      <div class="hero"><div class="eyebrow">// Sell</div><h1>List your fit</h1>
      <p>You need an account to sell on Plugged.</p></div>
      <button class="btn" id="goLogin">Log in / sign up</button>
    `;
    document.getElementById('goLogin').onclick = ()=> openAuthModal('signup');
    return;
  }
  document.getElementById('app').innerHTML = `
    <div class="hero"><div class="eyebrow">// Sell</div><h1>List your fit</h1>
    <p>Fill in details so buyers can find it when they search. The delivery fee (KES ${DELIVERY_FEE}) and platform commission (${Math.round(COMMISSION_RATE*100)}%) are added automatically — enter just your selling price.</p></div>
    <div class="card-box">
      <form id="sellForm">
        <label>Category
          <select name="category" required>${CATEGORIES.map(c=>`<option>${c}</option>`).join('')}</select>
        </label>
        <label>Title <input name="title" required placeholder="e.g. Nike Air Force 1, White"></label>
        <div class="row2">
          <label>Brand <input name="brand" placeholder="e.g. Nike, Levi's, Unbranded"></label>
          <label>Size <input name="size" required placeholder="e.g. 42, M, 32W"></label>
        </div>
        <label>Condition
          <select name="condition" required><option>Brand New</option><option>Thrifted</option></select>
        </label>
        <label>Description (color, material, fit, flaws — buyers search by this)
          <textarea name="description" required placeholder="e.g. Black, cotton, slim fit, worn twice, no flaws"></textarea>
        </label>
        <label>Your selling price (KES, item only)
          <input name="price" type="number" min="1" required placeholder="e.g. 1500">
        </label>
        <label>Photo (optional)
          <input name="image" type="file" accept="image/*" id="imageInput">
          <img id="thumbPreview" class="thumb-preview" style="display:none;">
        </label>
        <p class="field-error" id="sellError" style="display:none;"></p>
        <button class="btn" type="submit">List item</button>
      </form>
    </div>
    <div class="note">
      Photos are stored on this server's disk (fine for launch). If you outgrow it, point uploads at
      Cloudinary or S3 instead — everything else in the app stays the same.
    </div>
  `;
  document.getElementById('imageInput').onchange = (e)=>{
    const file = e.target.files[0];
    const prev = document.getElementById('thumbPreview');
    if(file){ prev.src = URL.createObjectURL(file); prev.style.display='block'; }
    else{ prev.style.display='none'; }
  };
  document.getElementById('sellForm').onsubmit = async (e)=>{
    e.preventDefault();
    const errEl = document.getElementById('sellError');
    try{
      const fd = new FormData(e.target);
      if(!fd.get('image') || fd.get('image').size === 0) fd.delete('image');
      await api('/api/listings', { method:'POST', body: fd });
      state.tab = "mylistings";
      await render();
      toast("Item listed!");
    }catch(err){
      errEl.textContent = err.message; errEl.style.display='block';
    }
  };
}

async function renderMyListings(){
  const mine = await api('/api/listings/mine');
  document.getElementById('app').innerHTML = `
    <div class="hero"><div class="eyebrow">// Your catalog</div><h1>My listings</h1><p>${mine.length} item(s) posted</p></div>
    <div class="grid">
      ${mine.length===0 ? '<div class="empty">You haven\\'t listed anything yet.</div>' : mine.map(l=>`
        <div class="tag-card">
          ${l.status==='sold' ? '<div class="status-sold">Sold</div>' : ''}
          <div class="badge-row"><span class="badge cat">${l.category}</span><span class="badge ${l.condition==='Brand New'?'new':'thrift'}">${l.condition}</span></div>
          <div class="thumb">${l.imageUrl ? `<img src="${l.imageUrl}" onerror="this.parentElement.innerHTML='No image'">` : 'No image'}</div>
          <h3>${l.title}</h3>
          <p class="brand-line">${l.brand||'Unbranded'} · Size ${l.size||'—'}</p>
          <div class="price-row">
            <div class="total">${money(l.price)}</div>
            ${l.status==='available' ? `<button class="btn secondary" data-remove="${l.id}">Remove</button>` : ''}
          </div>
        </div>
      `).join('')}
    </div>
  `;
  document.querySelectorAll('[data-remove]').forEach(b=>{
    b.onclick = async ()=>{
      await api('/api/listings/'+b.dataset.remove, { method:'DELETE' });
      await render();
      toast("Listing removed.");
    };
  });
}

async function renderMyOrders(){
  await loadMyOrders();
  document.getElementById('app').innerHTML = `
    <div class="hero"><div class="eyebrow">// Your orders</div><h1>My orders</h1><p>${state.orders.length} order(s) placed</p></div>
    ${state.orders.length===0 ? '<div class="empty">No orders yet — go browse the market.</div>' : `
    <table>
      <thead><tr><th>Item</th><th>Total</th><th>Status</th><th>Placed</th></tr></thead>
      <tbody>
        ${state.orders.map(o=>`<tr>
          <td>${o.listingTitle}<br><span style="color:var(--text-dim);font-size:11px;">${o.listingCategory}</span></td>
          <td>${money(o.total)}</td>
          <td><span class="badge ${o.status==='delivered'?'new':'thrift'}">${o.status}</span></td>
          <td>${new Date(o.createdAt).toLocaleDateString()}</td>
        </tr>`).join('')}
      </tbody>
    </table>`}
  `;
}

async function renderAdmin(){
  await loadAdminOrders();
  const totalCommission = state.orders.reduce((s,o)=>s+o.commission,0);
  const pending = state.orders.filter(o=>o.status==='pending').length;
  document.getElementById('app').innerHTML = `
    <div class="hero"><div class="eyebrow">// Admin</div><h1>Orders</h1><p>All orders across the platform. Confirm payment and delivery here.</p></div>
    <div class="stat-row">
      <div class="stat"><div class="num">${state.orders.length}</div><div class="lbl">Total orders</div></div>
      <div class="stat"><div class="num">${pending}</div><div class="lbl">Pending</div></div>
      <div class="stat"><div class="num">${money(totalCommission)}</div><div class="lbl">Commission earned</div></div>
    </div>
    ${state.orders.length===0 ? '<div class="empty">No orders yet.</div>' : `
    <table>
      <thead><tr><th>Item</th><th>Buyer</th><th>Contact</th><th>Address</th><th>Item</th><th>Delivery</th><th>Your cut</th><th>Total</th><th>Status</th><th></th></tr></thead>
      <tbody>
        ${state.orders.map(o=>`<tr>
          <td>${o.listingTitle}</td>
          <td>${o.buyerName}<br><span style="color:var(--text-dim);font-size:11px;">@${o.buyerUsername}</span></td>
          <td>${o.buyerPhone}</td>
          <td>${o.buyerAddress}</td>
          <td>${money(o.itemPrice)}</td>
          <td>${money(o.deliveryFee)}</td>
          <td>${money(o.commission)}</td>
          <td><b>${money(o.total)}</b></td>
          <td><span class="badge ${o.status==='delivered'?'new':'thrift'}">${o.status}</span></td>
          <td>${o.status!=='delivered' ? `<button class="btn teal" data-deliver="${o.id}" style="padding:6px 10px;font-size:11px;">Mark delivered</button>` : ''}</td>
        </tr>`).join('')}
      </tbody>
    </table>`}
  `;
  document.querySelectorAll('[data-deliver]').forEach(b=>{
    b.onclick = async ()=>{
      await api('/api/orders/'+b.dataset.deliver+'/deliver', { method:'PATCH' });
      await render();
      toast("Order marked delivered.");
    };
  });
}

async function render(){
  renderNav();
  renderAuthbar();
  try{
    if(state.tab==='browse') await renderBrowse();
    else if(state.tab==='sell') renderSell();
    else if(state.tab==='mylistings') await renderMyListings();
    else if(state.tab==='myorders') await renderMyOrders();
    else if(state.tab==='admin') await renderAdmin();
  }catch(err){
    if(err.message && err.message.toLowerCase().includes('session')){
      clearSession(); state.tab='browse'; renderAuthbar(); await renderBrowse();
      toast('Session expired — please log in again.');
    } else {
      document.getElementById('app').innerHTML = `<div class="empty">${err.message}</div>`;
    }
  }
}

(async function init(){
  document.getElementById('app').innerHTML = '<p style="color:var(--text-dim);padding:40px 0;">Booting up Plugged...</p>';
  await loadConfig();
  await render();
})();
</script>
</body>
</html>
